name: offline-verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BOT_MODE: offline
      ORDER_SUBMISSION_ENABLED: 'false'
      ETORO_API_KEY: ''
      ETORO_USER_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified release
        with:
          persist-credentials: false
      - name: Install pinned uv on ephemeral runner
        run: python -m pip install uv==0.12.12
      - name: Install locked environment
        run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Unit, contracts, recovery and HTTP end-to-end
        run: uv run pytest --cov=intraday_etoro_lab --cov-branch --cov-report=json:runtime/coverage.json
      - run: uv run python scripts/check_coverage.py
      - run: uv run python scripts/scan_secrets.py
      - run: uv run bot doctor
      - run: uv run bot demo-offline
      - run: uv build --offline
