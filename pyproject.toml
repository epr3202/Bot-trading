[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "intraday-etoro-lab"
version = "0.1.0"
description = "Demo-only ORB/RVOL intraday research laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3", "PyYAML>=6,<7", "httpx>=0.28,<0.29",
  "pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=19,<24",
  "exchange-calendars>=4.11,<5", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "tzdata>=2025.1",
]

[project.scripts]
bot = "intraday_etoro_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "pandas-stubs>=2.2,<3", "build>=1.2,<2", "hatchling==1.32.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/intraday_etoro_lab"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "configs", "scripts", "docs", ".github",
  "data/README.md", "reports/README.md", "AGENTS.md", "README.md",
  "BOOTSTRAP_SPEC.md", "STATUS.md", "TASKS.md", "HANDOFF.md",
  "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md",
  "pyproject.toml", "uv.lock", ".python-version", ".env.example",
  ".gitignore", ".gitattributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["external: explicitly authorized external integration only"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pyarrow.*"]
ignore_missing_imports = true
